{
  "networks": {
    "store-network": {
      "driver": "bridge"
    }
  },
  "services": {
    "auth-service": {
      "command": null,
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      },
      "entrypoint": null,
      "environment": {
        "JWT_SECRET": "${JWT_SECRET:?Set JWT_SECRET}",
        "SPRING_DATASOURCE_PASSWORD": "${DB_PASSWORD:?Set DB_PASSWORD}",
        "SPRING_DATASOURCE_URL": "jdbc:postgresql://postgres:5432/auth_db",
        "SPRING_DATASOURCE_USERNAME": "postgres",
        "JAVA_TOOL_OPTIONS": "-Xms48m -Xmx160m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -Xss512k -XX:ActiveProcessorCount=1 -XX:+ExitOnOutOfMemoryError",
        "SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE": "5",
        "SERVER_TOMCAT_THREADS_MAX": "25",
        "SERVER_TOMCAT_THREADS_MIN_SPARE": "2"
      },
      "networks": {
        "store-network": null
      },
      "restart": "unless-stopped",
      "image": "${REGISTRY_IMAGE:?Set REGISTRY_IMAGE}/auth-service:${RELEASE_TAG:?Set RELEASE_TAG}",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8081/health >/dev/null"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 30,
        "start_period": "60s"
      },
      "mem_limit": "448m",
      "pids_limit": 180
    },
    "inventory-service": {
      "command": null,
      "depends_on": {
        "kafka": {
          "condition": "service_healthy"
        },
        "postgres": {
          "condition": "service_healthy"
        },
        "redis": {
          "condition": "service_healthy"
        }
      },
      "entrypoint": null,
      "environment": {
        "CATALOG_GRPC_HOST": "inventory-service",
        "JWT_SECRET": "${JWT_SECRET:?Set JWT_SECRET}",
        "SPRING_DATASOURCE_PASSWORD": "${DB_PASSWORD:?Set DB_PASSWORD}",
        "SPRING_DATASOURCE_URL": "jdbc:postgresql://postgres:5432/inventory_db",
        "SPRING_DATASOURCE_USERNAME": "postgres",
        "SPRING_DATA_REDIS_HOST": "redis",
        "SPRING_DATA_REDIS_PORT": "6379",
        "SPRING_KAFKA_BOOTSTRAP_SERVERS": "kafka:29092",
        "JAVA_TOOL_OPTIONS": "-Xms48m -Xmx160m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -Xss512k -XX:ActiveProcessorCount=1 -XX:+ExitOnOutOfMemoryError",
        "SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE": "5",
        "SERVER_TOMCAT_THREADS_MAX": "25",
        "SERVER_TOMCAT_THREADS_MIN_SPARE": "2"
      },
      "networks": {
        "store-network": null
      },
      "restart": "unless-stopped",
      "image": "${REGISTRY_IMAGE:?Set REGISTRY_IMAGE}/inventory-service:${RELEASE_TAG:?Set RELEASE_TAG}",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8083/health >/dev/null"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 30,
        "start_period": "60s"
      },
      "mem_limit": "512m",
      "pids_limit": 180
    },
    "kafka": {
      "command": null,
      "entrypoint": null,
      "environment": {
        "CLUSTER_ID": "MkU3OEVBNTcwNTJENDM2Qk",
        "KAFKA_ADVERTISED_LISTENERS": "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092",
        "KAFKA_CONTROLLER_LISTENER_NAMES": "CONTROLLER",
        "KAFKA_CONTROLLER_QUORUM_VOTERS": "1@kafka:29093",
        "KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS": "0",
        "KAFKA_INTER_BROKER_LISTENER_NAME": "PLAINTEXT",
        "KAFKA_LISTENERS": "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092",
        "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP": "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT",
        "KAFKA_LOG_DIRS": "/var/lib/kafka/data",
        "KAFKA_NODE_ID": "1",
        "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR": "1",
        "KAFKA_PROCESS_ROLES": "broker,controller",
        "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR": "1",
        "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR": "1",
        "KAFKA_HEAP_OPTS": "-Xms128m -Xmx192m",
        "KAFKA_LOG_RETENTION_HOURS": "72"
      },
      "image": "confluentinc/cp-kafka:7.5.0",
      "networks": {
        "store-network": null
      },
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "KAFKA_HEAP_OPTS=\"-Xms16m -Xmx64m\" kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"
        ],
        "interval": "10s",
        "timeout": "10s",
        "retries": 20
      },
      "mem_limit": "448m",
      "volumes": [
        "kafka_data:/var/lib/kafka/data"
      ]
    },
    "order-service": {
      "command": null,
      "depends_on": {
        "kafka": {
          "condition": "service_healthy"
        },
        "postgres": {
          "condition": "service_healthy"
        },
        "redis": {
          "condition": "service_healthy"
        }
      },
      "entrypoint": null,
      "environment": {
        "CATALOG_GRPC_HOST": "inventory-service",
        "JWT_SECRET": "${JWT_SECRET:?Set JWT_SECRET}",
        "SPRING_DATASOURCE_PASSWORD": "${DB_PASSWORD:?Set DB_PASSWORD}",
        "SPRING_DATASOURCE_URL": "jdbc:postgresql://postgres:5432/order_db",
        "SPRING_DATASOURCE_USERNAME": "postgres",
        "SPRING_DATA_REDIS_HOST": "redis",
        "SPRING_DATA_REDIS_PORT": "6379",
        "SPRING_KAFKA_BOOTSTRAP_SERVERS": "kafka:29092",
        "JAVA_TOOL_OPTIONS": "-Xms48m -Xmx160m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -Xss512k -XX:ActiveProcessorCount=1 -XX:+ExitOnOutOfMemoryError",
        "SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE": "5",
        "SERVER_TOMCAT_THREADS_MAX": "25",
        "SERVER_TOMCAT_THREADS_MIN_SPARE": "2"
      },
      "networks": {
        "store-network": null
      },
      "restart": "unless-stopped",
      "image": "${REGISTRY_IMAGE:?Set REGISTRY_IMAGE}/order-service:${RELEASE_TAG:?Set RELEASE_TAG}",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8082/health >/dev/null"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 30,
        "start_period": "60s"
      },
      "mem_limit": "576m",
      "pids_limit": 180
    },
    "postgres": {
      "command": [
        "postgres",
        "-c",
        "shared_buffers=32MB",
        "-c",
        "max_connections=40"
      ],
      "entrypoint": null,
      "environment": {
        "POSTGRES_DB": "postgres",
        "POSTGRES_MULTIPLE_DATABASES": "auth_db,order_db,inventory_db",
        "POSTGRES_PASSWORD": "${DB_PASSWORD:?Set DB_PASSWORD}",
        "POSTGRES_USER": "postgres"
      },
      "image": "postgres:16-alpine",
      "networks": {
        "store-network": null
      },
      "volumes": [
        {
          "type": "volume",
          "source": "postgres_data",
          "target": "/var/lib/postgresql/data"
        },
        {
          "type": "bind",
          "source": "./init-multiple-dbs.sh",
          "target": "/docker-entrypoint-initdb.d/init-multiple-dbs.sh",
          "read_only": true
        }
      ],
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      },
      "mem_limit": "192m"
    },
    "redis": {
      "command": [
        "redis-server",
        "--maxmemory",
        "48mb",
        "--maxmemory-policy",
        "allkeys-lru"
      ],
      "entrypoint": null,
      "image": "redis:7-alpine",
      "networks": {
        "store-network": null
      },
      "volumes": [
        {
          "type": "volume",
          "source": "redis_data",
          "target": "/data",
          "volume": {}
        }
      ],
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "redis-cli",
          "ping"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      },
      "mem_limit": "96m"
    },
    "gateway": {
      "image": "nginx:1.27-alpine",
      "restart": "unless-stopped",
      "ports": [
        "127.0.0.1:${HTTP_PORT:-18080}:80"
      ],
      "volumes": [
        "./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      ],
      "depends_on": {
        "auth-service": {
          "condition": "service_healthy"
        },
        "order-service": {
          "condition": "service_healthy"
        },
        "inventory-service": {
          "condition": "service_healthy"
        }
      },
      "networks": [
        "store-network"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/health >/dev/null"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 10
      },
      "mem_limit": "32m"
    }
  },
  "volumes": {
    "postgres_data": {},
    "redis_data": {},
    "kafka_data": {}
  }
}
