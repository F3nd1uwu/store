server.port=8083
spring.application.name=inventory-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/inventory_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.sql.init.mode=always
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.cache.redis.time-to-live=600000

app.jwt.secret=${JWT_SECRET:local-development-secret-key-change-before-deploy-123456}

spring.kafka.consumer.group-id=inventory-saga
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
