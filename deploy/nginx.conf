server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    location = / { default_type application/json; return 200 '{"application":"store","services":["auth","order","inventory"],"health":"/health"}'; }
    location = /health { default_type application/json; return 200 '{"status":"UP"}'; }
    location /api/v1/auth/ { proxy_pass http://auth-service:8081; }
    location = /api/v1/profile { proxy_pass http://auth-service:8081; }
    location /api/v1/orders { proxy_pass http://order-service:8082; }
    location /api/v1/cart { proxy_pass http://order-service:8082; }
    location /api/v1/coupons { proxy_pass http://order-service:8082; }
    location /api/v1/products { proxy_pass http://inventory-service:8083; }
    location /api/v1/categories { proxy_pass http://inventory-service:8083; }
    location /api/v1/wallet { proxy_pass http://inventory-service:8083; }
    location / { return 404; }
}
