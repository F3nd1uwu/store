server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_upstream http://auth-service:8081;
    set $order_upstream http://order-service:8082;
    set $inventory_upstream http://inventory-service:8083;
    location = / { default_type application/json; return 200 '{"application":"store","services":["auth","order","inventory"],"health":"/health"}'; }
    location = /health { default_type application/json; return 200 '{"status":"UP"}'; }
    location /api/v1/auth/ { proxy_pass $auth_upstream; }
    location = /api/v1/profile { proxy_pass $auth_upstream; }
    location /api/v1/orders { proxy_pass $order_upstream; }
    location /api/v1/cart { proxy_pass $order_upstream; }
    location /api/v1/coupons { proxy_pass $order_upstream; }
    location /api/v1/products { proxy_pass $inventory_upstream; }
    location /api/v1/categories { proxy_pass $inventory_upstream; }
    location /api/v1/wallet { proxy_pass $inventory_upstream; }
    location / { return 404; }
}
