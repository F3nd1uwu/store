name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA with successfully published GHCR images
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Validate release identifier
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected full lowercase commit SHA'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Configure DEPLOY_HOST'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo 'Configure DEPLOY_USER'; exit 1; }
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload Compose and gateway configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml docker-compose.proxy.yml init-multiple-dbs.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/yasakovd/"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -r deploy \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/yasakovd/"
      - name: Pull release and wait for healthy services
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          registry_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /home/yasakovd && REGISTRY_IMAGE='$registry_image' RELEASE_TAG='$RELEASE_SHA' sh -s" <<'REMOTE'
          set -eu
          export REGISTRY_IMAGE RELEASE_TAG
          docker compose -f docker-compose.prod.yml -f docker-compose.proxy.yml pull
          docker compose -f docker-compose.prod.yml -f docker-compose.proxy.yml up -d --wait --wait-timeout 240
          docker compose -f docker-compose.prod.yml -f docker-compose.proxy.yml ps
          REMOTE
