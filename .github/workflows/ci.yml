name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --console=plain
      - name: Upload JUnit XML and HTML reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/tests/test/**
          retention-days: 14

  assemble:
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build applications and manual deployment archive
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon --console=plain
          python3 scripts/package-release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-jars
          path: |
            auth-service/build/libs/*.jar
            order-service/build/libs/*.jar
            inventory-service/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual-deployment-release
          path: build/store-yasakovd-release.zip
          if-no-files-found: error
          retention-days: 14

  integration-tests:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-jars
          path: .
      - name: Start real services with PostgreSQL, Redis and Kafka
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build --wait --wait-timeout 240
      - name: Test API, gRPC, saga, compensation and inbox
        run: python3 scripts/integration.py
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color > compose.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-service-logs
          path: compose.log
          retention-days: 14
      - name: Stop the isolated CI stack
        if: always()
        run: docker compose down

  package-images:
    needs: [assemble, integration-tests]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-jars
          path: .
      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish immutable images
        run: |
          registry_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in auth-service order-service inventory-service; do
            image="$registry_image/$service:$GITHUB_SHA"
            docker build -f Dockerfile.runtime --build-arg SERVICE="$service" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$image" .
            docker push "$image"
          done
