version: '3.8'

services:
  # ==========================================
  # База данных PostgreSQL (общий сервер с БД под каждый сервис)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: store-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: auth_db,order_db,inventory_db,payment_db,delivery_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    networks:
      - store-network

  # ==========================================
  # Кеш Redis
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: store-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - store-network

  # ==========================================
  # Брокер сообщений Apache Kafka (KRaft)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: store-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - store-network

  # ==========================================
  # UI для Kafka
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: store-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - store-network

  # ==========================================
  # Микросервис заказов (Order Service)
  # ==========================================
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: store-order-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - postgres
      - kafka
      - redis
    networks:
      - store-network

networks:
  store-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: