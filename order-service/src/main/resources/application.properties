server.port=8082
spring.application.name=order-service

# Подключение к PostgreSQL в Docker
spring.datasource.url=jdbc:postgresql://localhost:5433/order_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Настройки JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Подключение к Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Время жизни кеша (TTL) — 10 минут
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.jwt.secret=${JWT_SECRET:local-development-secret-key-change-before-deploy-123456}

spring.kafka.consumer.group-id=order-saga
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

spring.sql.init.mode=always
catalog.grpc.host=${CATALOG_GRPC_HOST:localhost}
